# Alice Test 配置文件示例
# 复制此文件为 config.yaml 并填入实际配置
# 对应 PRD 第 5.1 节 config.yaml 结构

# ============================================
# LLM API 配置
# ============================================
llm_api:
  provider: "deepseek"
  api_key: ""  # 留空则从环境变量 DEEPSEEK_API_KEY 读取

  # 模型选择 (2026)
  # 可用模型：
  #   - deepseek-v4-flash : 性价比首选，1M 上下文，原生支持思考模式
  #   - deepseek-v4-pro   : 推理更强，价格约 v4-flash 的 ~6 倍
  #   - deepseek-chat     : v4-flash 非思考模式的别名 (将于 2026/07/24 弃用)
  #   - deepseek-reasoner : v4-flash 思考模式的别名 (将于 2026/07/24 弃用)
  model: "deepseek-v4-flash"          # Module A (市场共识) 使用
  thesis_model: ""                    # Module B (信念投影) 使用；留空则复用 model
                                       # 推荐设为 "deepseek-v4-pro" 以获得更强推理

  temperature: 0  # 必须为 0，保证评分稳定（思考模式下此参数不生效）
  max_tokens: 4096
  max_retries: 2  # 请求失败时的最大重试次数

  # Module B 思考模式配置（可选）
  # 思考模式会让模型在输出最终答案前先进行深度推理
  # 优点：可能提升增长率预估的准确性
  # 缺点：增加 token 消耗和响应时间
  thesis_thinking_enabled: false  # 是否为 Module B 启用思考模式
  thesis_thinking_max_tokens: 16384  # 思考模式下最大 token 数（含思维链），最大 65536

# ============================================
# 数据源配置
# ============================================
data_sources:
  # A 股行情数据源
  a_shares:
    provider: "akshare"  # 或 "tushare"
    token: ""  # Tushare 需要

  # 港美股行情数据源
  hk_us:
    provider: "yfinance"

  # 文本数据源配置
  text:
    # A 股文本源配置（基于 AkShare API）
    a_share:
      # 启用的数据源类型
      # - research: 研报 (stock_research_report_em)
      # - irm: 互动易问答 (stock_sns_sseinfo / stock_irm_cninfo)
      # - rating: 机构评级变动 (stock_institute_recommend_detail)
      # - news: 新闻 (stock_news_em)
      enabled_sources:
        - research
        - irm
        - rating
        - news

      # 各数据源的配额权重
      # 总 max_items 会按权重比例分配给各数据源
      quota_weights:
        research: 4   # 研报权重最高，最有分析价值
        irm: 3        # 互动易直接反映投资者担忧
        rating: 2     # 评级变动是预期变化信号
        news: 3       # 新闻补充市场叙事

    # 港美股文本源配置（基于 Web Search）
    hk_us:
      # 搜索服务提供商
      # - serper: 推荐，免费额度 2,500次/月，性价比最高
      # - serpapi: 备选，免费额度 100次/月
      search_provider: "serper"

      # 搜索 API 密钥
      # 留空则从环境变量读取：
      # - serper: SERPER_API_KEY
      # - serpapi: SERPAPI_KEY
      search_api_key: ""

      # 多层浏览配置
      # 用于从搜索结果页深入获取研报详情
      browsing:
        enabled: true           # 是否启用多层浏览
        max_depth: 2            # 最大浏览深度 (1-3)
        max_links_per_page: 3   # 每页最多跟踪的链接数
        link_selection_mode: "llm"  # 链接选择模式: "llm" 或 "rule"

      # 可信域名白名单
      # 只从这些域名获取内容，保证信息质量
      trusted_domains:
        - "seekingalpha.com"    # 美股研报社区
        - "tipranks.com"        # 分析师评级汇总
        - "morningstar.com"     # 晨星研究
        - "finance.yahoo.com"   # 雅虎财经
        - "bloomberg.com"       # 彭博
        - "reuters.com"         # 路透
        - "wsj.com"             # 华尔街日报
        - "ft.com"              # 金融时报
        - "cnbc.com"            # CNBC
        - "barrons.com"         # 巴伦周刊

      # 搜索查询模板
      # 支持占位符: {ticker} = 股票代码, {name} = 公司名称
      search_templates:
        research: "{ticker} {name} analyst report research"
        news: "{ticker} {name} news"
        earnings: "{ticker} earnings analysis"

  # 爬虫/数据获取配置
  crawler:
    use_mock: false
    lookback_hours: 48
    max_items_per_ticker: 10

# ============================================
# 投资标的列表
# ============================================
targets:
  - ticker: "601985.SH"
    name: "中国核电"
    thesis: >
      AI算力需要稳定基荷电力，核电是物理刚需，
      具备类公用事业的确定性和科技股的成长性。

  - ticker: "600150.SH"
    name: "中国船舶"
    thesis: >
      全球供应链重构导致造船长周期开启，
      战略资产应按重置成本定价，而非简单的制造业PE。

  - ticker: "0700.HK"
    name: "腾讯控股"
    thesis: >
      国内社交和游戏基本盘稳固，海外游戏和云业务是增量，
      回购和分红提升股东回报，估值修复空间大。

# ============================================
# 输出配置
# ============================================
output:
  format: "csv"  # 或 "sqlite"
  path: "./output/audit_report.csv"

# ============================================
# 调度配置
# ============================================
scheduler:
  cron: "0 18 * * MON-FRI"  # 每个交易日 18:00 运行
  enabled: true

# ============================================
# Gap 判定阈值配置
# ============================================
# 简化模式：仅基于 gap 值判断（推荐）
gap_thresholds:
  opportunity: 5.0   # gap >= 5% 触发 OPPORTUNITY 信号
  overheated: -5.0   # gap <= -5% 触发 OVERHEATED 信号

# 高级模式（可选）：结合情绪分数判断
# gap_thresholds:
#   opportunity_gap_min: 10.0  # Gap > 10 视为机会
#   opportunity_sentiment_max: 40  # 情绪 < 40 视为悲观
#   overheated_sentiment_min: 80  # 情绪 > 80 视为过热
