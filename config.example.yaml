# Alice Test 配置文件示例
# 复制此文件为 config.yaml 并填入实际配置
# 对应 PRD 第 5.1 节 config.yaml 结构

# ============================================
# LLM API 配置
# ============================================
llm_api:
  provider: "deepseek"
  api_key: ""  # 留空则从环境变量 DEEPSEEK_API_KEY 读取
  model: "deepseek-chat"
  temperature: 0  # 必须为 0，保证评分稳定
  max_tokens: 4096
  max_retries: 2  # 请求失败时的最大重试次数

# ============================================
# 数据源配置
# ============================================
data_sources:
  # A 股行情数据源
  a_shares:
    provider: "akshare"  # 或 "tushare"
    token: ""  # Tushare 需要

  # 港美股行情数据源
  hk_us:
    provider: "yfinance"

  # 文本数据源配置
  text:
    # A 股文本源（基于 AkShare）
    a_share:
      enabled_sources:
        - research    # stock_research_report_em
        - irm         # stock_sns_sseinfo / stock_irm_cninfo
        - rating      # stock_institute_recommend_detail
        - news        # stock_news_em
      quota_weights:
        research: 4
        irm: 3
        rating: 2
        news: 3

    # 港美股文本源（预留，需要 Web Search）
    hk_us:
      search_provider: "serpapi"
      search_api_key: ""
      trusted_domains:
        - "bloomberg.com"
        - "reuters.com"
        - "seekingalpha.com"

  # 爬虫/数据获取配置
  crawler:
    use_mock: false
    lookback_hours: 48
    max_items_per_ticker: 10

# ============================================
# 投资标的列表
# ============================================
targets:
  - ticker: "601985.SH"
    name: "中国核电"
    thesis: >
      AI算力需要稳定基荷电力，核电是物理刚需，
      具备类公用事业的确定性和科技股的成长性。

  - ticker: "600150.SH"
    name: "中国船舶"
    thesis: >
      全球供应链重构导致造船长周期开启，
      战略资产应按重置成本定价，而非简单的制造业PE。

  - ticker: "0700.HK"
    name: "腾讯控股"
    thesis: >
      国内社交和游戏基本盘稳固，海外游戏和云业务是增量，
      回购和分红提升股东回报，估值修复空间大。

# ============================================
# 输出配置
# ============================================
output:
  format: "csv"  # 或 "sqlite"
  path: "./output/audit_report.csv"

# ============================================
# 调度配置
# ============================================
scheduler:
  cron: "0 18 * * MON-FRI"  # 每个交易日 18:00 运行
  enabled: true

# ============================================
# Gap 判定阈值配置
# ============================================
gap_thresholds:
  opportunity_gap_min: 10.0  # Gap > 10 视为机会
  opportunity_sentiment_max: 40  # 情绪 < 40 视为悲观
  overheated_sentiment_min: 80  # 情绪 > 80 视为过热
