# Alice Test 配置文件示例
# 复制此文件为 config.yaml 并填入实际配置
# 对应 PRD 第 5.1 节 config.yaml 结构

# ============================================
# LLM API 配置
# ============================================
llm_api:
  provider: "deepseek"
  # 密钥来源（二选一，均不驻留配置对象）：
  #   1) 留空 ""，运行期从固定环境变量 DEEPSEEK_API_KEY 读取；
  #   2) 写成 ${ENV} 占位（如 api_key: "${DEEPSEEK_API_KEY}"），运行期 getter 即时从
  #      该环境变量解析。占位只是引用、不是明文；解析值绝不写回配置 / dump / 日志。
  api_key: ""  # 运行期只从环境变量 DEEPSEEK_API_KEY 读取（或写 ${YOUR_ENV} 占位）

  # 模型按阶段分流（参 PRD 4.2 / 迁移计划 §4 目标矩阵）：
  #   - 非 thinking 打分 / 汇总路径（Module A / S3 / S7）用 model（v4-flash）；
  #   - thinking 深推理路径（目标 S1/S2/S4/S5/B）用 model_pro（v4-pro）。
  # 现状：thinking 仅 Module B / S5 经 thesis_thinking_enabled 接线，S1–S4 待 Q2/Q3 定后接。
  model: "deepseek-v4-flash"  # 非 thinking 路径；`deepseek-chat` 别名 2026-07-24 退役
  model_pro: "deepseek-v4-pro"  # thinking 路径；`deepseek-reasoner` 别名同期退役
  temperature: 0  # 非 thinking 路径必须为 0（非 0 直接报错）；thinking 路径此参数为 no-op
  max_tokens: 4096
  max_retries: 2  # 请求失败时的最大重试次数

  # thinking 路径推理强度：high（默认，绝大多数够用）| max（目标仅最难阶段如 S4 开）。
  # 现状为客户端级默认，作用于已启用 thinking 的 Module B / S5；per-stage max 待 Q2 定。
  reasoning_effort: "high"

  # thinking 模式配置（可选；当前驱动 Module B / S5 信念投影与综合）
  # 思考模式会让模型在输出最终答案前先深度推理：提升增长率预估质量，但增加 token / 延迟 / 成本。
  # 启用后该路径走 model_pro + reasoning_effort。
  thesis_thinking_enabled: false  # 是否为 Module B / S5 启用思考模式
  thesis_thinking_max_tokens: 16384  # 思考模式下最大 token 数（含思维链），最大 65536

# ============================================
# 数据源配置
# ============================================
data_sources:
  # A 股行情数据源
  a_shares:
    provider: "akshare"  # 或 "tushare"
    token: ""  # 使用 Tushare 时运行期只从环境变量 TUSHARE_TOKEN 读取（或写 ${YOUR_ENV} 占位）

  # 港美股行情数据源
  hk_us:
    provider: "yfinance"

  # 文本数据源配置
  text:
    # A 股文本源配置（基于 AkShare API）
    a_share:
      # 启用的数据源类型
      # - research: 研报 (stock_research_report_em)
      # - irm: 互动易问答 (stock_sns_sseinfo / stock_irm_cninfo)
      # - rating: 机构评级变动 (stock_institute_recommend_detail)
      # - news: 新闻 (stock_news_em)
      # - announcement: 公告 (stock_zh_a_disclosure_report_cninfo)  # #65/#66 新增
      # - cls: 财联社电报 (stock_telegraph_cls)                      # #65/#66 新增
      enabled_sources:
        - research
        - irm
        - rating
        - news
        - announcement
        - cls

      # 各数据源的配额权重
      # 总 max_items 会按权重比例分配给各数据源
      quota_weights:
        research: 4      # 研报权重最高，最有分析价值
        irm: 3           # 互动易直接反映投资者担忧
        rating: 2        # 评级变动是预期变化信号
        news: 3          # 新闻补充市场叙事
        announcement: 2  # 公告/披露补充
        cls: 2           # 财联社高时效电报

      # A 股文本回溯窗口覆盖（小时）；留空沿用 crawler.lookback_hours。
      # #65/#66：48h 常因太短信息不足，可调长（如 168 / 336）。
      # lookback_hours: 168

    # 港美股文本源配置（基于 Web Search）
    hk_us:
      # 搜索服务提供商
      # - serper: 推荐，免费额度 2,500次/月，性价比最高
      # - serpapi: 备选，免费额度 100次/月
      search_provider: "serper"

      # 搜索 API 密钥
      # 运行期只从环境变量读取：
      # - serper: SERPER_API_KEY
      # - serpapi: SERPAPI_KEY
      search_api_key: ""  # 兼容字段；真实密钥不要写入配置

      # 多层浏览配置
      # 用于从搜索结果页深入获取研报详情
      browsing:
        enabled: true           # 是否启用多层浏览
        max_depth: 2            # 最大浏览深度 (1-3)
        max_links_per_page: 3   # 每页最多跟踪的链接数
        link_selection_mode: "llm"  # 链接选择模式: "llm" 或 "rule"

      # 可信域名白名单
      # 只从这些域名获取内容，保证信息质量
      trusted_domains:
        - "seekingalpha.com"    # 美股研报社区
        - "tipranks.com"        # 分析师评级汇总
        - "morningstar.com"     # 晨星研究
        - "finance.yahoo.com"   # 雅虎财经
        - "bloomberg.com"       # 彭博
        - "reuters.com"         # 路透
        - "wsj.com"             # 华尔街日报
        - "ft.com"              # 金融时报
        - "cnbc.com"            # CNBC
        - "barrons.com"         # 巴伦周刊

      # 搜索查询模板
      # 支持占位符: {ticker} = 股票代码, {name} = 公司名称
      search_templates:
        research: "{ticker} {name} analyst report research"
        news: "{ticker} {name} news"
        earnings: "{ticker} earnings analysis"

  # 爬虫/数据获取配置
  crawler:
    use_mock: false
    lookback_hours: 48
    max_items_per_ticker: 10

# ============================================
# 投资标的列表
# ============================================
targets:
  - ticker: "601985.SH"
    name: "中国核电"
    thesis: >
      AI算力需要稳定基荷电力，核电是物理刚需，
      具备类公用事业的确定性和科技股的成长性。

  - ticker: "600150.SH"
    name: "中国船舶"
    thesis: >
      全球供应链重构导致造船长周期开启，
      战略资产应按重置成本定价，而非简单的制造业PE。

  - ticker: "0700.HK"
    name: "腾讯控股"
    thesis: >
      国内社交和游戏基本盘稳固，海外游戏和云业务是增量，
      回购和分红提升股东回报，估值修复空间大。

# ============================================
# 输出配置
# ============================================
output:
  format: "csv"  # 或 "sqlite"
  path: "./output/audit_report.csv"

# ============================================
# 持久化配置（P2：决策日志 / 持仓 / 风控史 / alpha 同库 SQLite）
# ============================================
# backend=csv（默认）：仅写上面 output 的审计报告 CSV。
# backend=sqlite：在审计报告之外，把每笔 S7 决策（含 WAIT、含 fail-closed 标记行）落进
#   决策日志 SQLite——供日后回填兑现、算命中率 + IC（IR=IC×√breadth 验证时钟，P0-5）。
#   决策按 decision_id = f"{ticker}-{asof_date}" 幂等 upsert，同交易日重跑不重复。
persistence:
  backend: "csv"            # 或 "sqlite"
  sqlite_path: "data/alice.db"  # backend=sqlite 时的 DB 文件路径

# ============================================
# S6 组合层风控配置（RiskEngine）
# ============================================
# 在 S5 认知差信号之上叠加组合层风控：仓位 sizing、行业聚类、双路退出。
# 纯规则/数学、确定性；仅对 signal==OPPORTUNITY 且 thesis_aligned 的标的给正权重。
# 全部字段可省略，省略即用下列默认值。
# risk:
#   ref_weight: 0.05          # 单笔软参考权重（非硬顶）
#   soft_cap: 0.10            # 单笔软护栏（可被整体风险预算进一步压低）
#   target_positions: 20      # 目标持仓数（~20 × 5% ≈ 满仓）
#   max_cluster_weight: 0.15  # 同簇（行业/主题）合计权重上限
#   total_risk_budget: 1.0    # 组合总投入上限（1.0=可满仓；预留现金 = 1 - Σw）
#   sizing_mode: "equal"      # v0.1 仅 equal 生效；conviction / risk_budget 待 D1 启用
#   enabled: true             # 关闭则不做风控叠加、不回填风控字段

# ============================================
# S3 proxy 备选库（100Step 借鉴 PR①）
# ============================================
# 启用后 S3 proxy 提案从「LLM 从零发明」变「从备选库选型 + 允许补充」：
# 备选库条目渲染进 S3 系统指令，选用条目的 proxy_spec 会带 [库:ID] 前缀。
# fail-closed：enabled=true 而库 yaml 缺失/损坏 → 启动直接报错，不会空库静默跑。
# 全部字段可省略，省略即用下列默认值。
# proxy_library:
#   enabled: true   # 生产 kill switch：false = 完全回到无库的现行为
#   path: null      # 备选库 yaml 覆盖路径；null = 包内 src/engines/resources/proxy_library.yaml

# ============================================
# 调度配置
# ============================================
scheduler:
  cron: "0 18 * * MON-FRI"  # 每个交易日 18:00 运行
  enabled: true

# ============================================
# Gap 判定阈值配置（信号语义 v2：纯 α 差双向触发）
# 拍板：D-20260627-P0-1 / D-20260627-CDX-1 / D-20260705-1（2026-07-08 落地）
# v1「gap+sentiment 双条件」判定式已废止；sentiment 摘出信号门。
# ============================================
gap_thresholds:
  opportunity_gap_min: 10.0  # gap > 10 → OPPORTUNITY（正 α）
  overheated_gap_min: 10.0   # gap < -10 → OVERHEATED（负 α → AVOID 不进场；默认与 opportunity 对称，数值未专门拍）
  # sentiment 过热 flag 阈值（不参与信号判定，只登记 SENTIMENT_OVERHEAT 给 S6）：
  # 代码默认 80；如需覆盖可设 overheated_sentiment_min（存量字段转任，会带 deprecation 提示）。
  # 旧字段 opportunity_sentiment_max 已废弃（兼容加载、忽略取值）。
