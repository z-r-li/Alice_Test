# Alice Test 配置文件示例
# 复制此文件为 config.yaml 并填入实际配置
# 对应 PRD 第 5.1 节 config.yaml 结构

# ============================================
# LLM API 配置
# ============================================
llm_api:
  provider: "deepseek"
  api_key: ""  # 留空则从环境变量 DEEPSEEK_API_KEY 读取
  model: "deepseek-chat"
  temperature: 0  # 必须为 0，保证评分稳定
  max_tokens: 4096
  max_retries: 2  # 请求失败时的最大重试次数

# ============================================
# 数据源配置
# ============================================
data_sources:
  # A 股数据源（PRD 格式）
  a_shares:
    provider: "tushare"  # 或 "akshare"
    token: ""  # Tushare Token，留空则从环境变量 TUSHARE_TOKEN 读取

  # 港美股数据源（PRD 格式）
  hk_us:
    provider: "yfinance"

  # 文本数据源配置
  text:
    # 原有配置（兼容）
    research_providers:
      - "中信证券"
      - "华泰证券"
      - "海通证券"
      - "Morgan Stanley"
      - "Goldman Sachs"
    news_sites:
      - "东方财富"
      - "新浪财经"
      - "彭博"
      - "路透"
    search_entrypoints:
      - "https://example-research-site.com"

    # A 股文本源配置
    a_share:
      enabled_sources:
        - research
        - irm
        - rating
        - news
      quota_weights:
        research: 4
        irm: 3
        rating: 2
        news: 3

    # 港美股文本源配置（预留）
    hk_us:
      search_provider: "serpapi"
      search_api_key: ""  # 从环境变量 SERPAPI_KEY 读取
      trusted_domains:
        - "bloomberg.com"
        - "reuters.com"
        - "seekingalpha.com"

  # 爬虫配置（对应 PRD 5.1）
  crawler:
    use_mock: true  # MVP 阶段使用模拟数据，生产环境设为 false
    use_llm_for_sources: true  # 是否使用 LLM 辅助生成数据源
    trusted_sources:
      cn:
        - "eastmoney.com"
        - "10jqka.com.cn"
        - "wind.com.cn"
      en:
        - "bloomberg.com"
        - "reuters.com"
    lookback_hours: 48  # 文本回溯时间窗口（小时），默认 48
    max_items_per_ticker: 10  # 每个标的最大文本数量，默认 10

# ============================================
# 投资标的列表
# ============================================
targets:
  - ticker: "601985.SH"
    name: "中国核电"
    thesis: >
      AI算力需要稳定基荷电力，核电是物理刚需，
      具备类公用事业的确定性和科技股的成长性。

  - ticker: "600150.SH"
    name: "中国船舶"
    thesis: >
      全球供应链重构导致造船长周期开启，
      战略资产应按重置成本定价，而非简单的制造业PE。

  - ticker: "0700.HK"
    name: "腾讯控股"
    thesis: >
      国内社交和游戏基本盘稳固，海外游戏和云业务是增量，
      回购和分红提升股东回报，估值修复空间大。

# ============================================
# 输出配置
# ============================================
output:
  format: "csv"  # 或 "sqlite"
  path: "./output/audit_report.csv"

# ============================================
# 调度配置
# ============================================
scheduler:
  cron: "0 18 * * MON-FRI"  # 每个交易日 18:00 运行
  enabled: true

# ============================================
# Gap 判定阈值配置
# ============================================
gap_thresholds:
  opportunity_gap_min: 10.0  # Gap > 10 视为机会
  opportunity_sentiment_max: 40  # 情绪 < 40 视为悲观
  overheated_sentiment_min: 80  # 情绪 > 80 视为过热
