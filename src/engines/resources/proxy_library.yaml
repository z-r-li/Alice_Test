    source_hint: 商品价格数据/行业指数
    cadence: 周/月
    applicability: ALL
    note: "tab 21/50；商品与指数属引擎越界"
  - id: S02
    name: 产能利用率/开工率
    category: 供给成本
    type_hint: due_diligence
    engine_computable: false
    spec_template: "实地/专家渠道核产能利用率（『飞工厂数货车』类经典尽调）"
    source_hint: 实地/专家访谈
    cadence: 事件
    applicability: ALL
    note: "tab 19"
  - id: S03
    name: 渠道/终端调研
    category: 供给成本
    type_hint: due_diligence
    engine_computable: false
    spec_template: "访谈经销商/渠道，验证出货与库存水位（与报表存货趋势对照）"
    source_hint: 访谈
    cadence: 事件
    applicability: ALL
    note: "tab 51 的落地形态；报表存货科目引擎不解析"

  # ============ 竞争格局 ============
  - id: C01
    # name 带黑名单词「同行」：裸「毛利率」会让 name 被词表误判引擎可算（复审 P2）
    name: 同行/竞对增速与盈利能力对比
    category: 竞争格局
    type_hint: qualitative
    engine_computable: false
    spec_template: "从研报判读公司与同行/可比公司的相对增速与盈利能力变化（跨公司口径）"
    source_hint: 研报文本
    cadence: 季
    applicability: ALL
    note: "tab 74-78；跨公司口径在引擎黑名单（同行/可比公司），只能 qualitative"
  - id: C02
    name: 进入壁垒变化
    category: 竞争格局
    type_hint: qualitative
    engine_computable: false
    spec_template: "判读牌照/技术/资本/网络效应等壁垒是否被侵蚀（新进入者动向）"
    source_hint: 研报/新闻
    cadence: 事件
    applicability: ALL
    note: "tab 31"
  - id: C03
    # name/source_hint 避开裸「盈利」：整行渲染文本须判不可算，防 LLM 抄行误标（复审 P2）
    name: 卖方一致预期修正方向
    category: 竞争格局
    type_hint: qualitative
    engine_computable: false
    spec_template: "统计近3月卖方评级与一致预期调整方向（上调/下调家数）"
    source_hint: "东财一致预期接口（stock_profit_forecast_em，可达；已是 Module A 输入）"
    cadence: 月
    applicability: "[CN]"
    note: "作 link 级 proxy 合法；注意与 implied_growth 同源，勿双计"

